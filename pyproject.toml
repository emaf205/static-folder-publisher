[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "static-folder-publisher"
version = "1.0.1"
description = "Turn folders of finished HTML pages into a complete static website."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Static Folder Publisher contributors" }
]
keywords = ["static-site", "publishing", "html", "file-based", "white-label"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP :: Site Management",
]
dependencies = []

[project.scripts]
publisher = "static_folder_publisher.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
